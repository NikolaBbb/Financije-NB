<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#185FA5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Financije">
<link rel="manifest" href="manifest.json">
<title>Financije</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
:root{
  --bg0:#fff;--bg1:#f5f5f7;--bg2:#ebebeb;
  --t0:#1a1a1a;--t1:#6b6b6b;
  --bd:#e0e0e0;--bd2:#efefef;
  --blue:#185FA5;--green:#1D9E75;--red:#D85A30;
  --orange:#854F0B;--orange-bg:#FFF8ED;--orange-bd:#F5D9A8;
}
@media(prefers-color-scheme:dark){
  :root{--bg0:#1c1c1e;--bg1:#2c2c2e;--bg2:#111;--t0:#f0f0f0;--t1:#8e8e93;--bd:#3a3a3c;--bd2:#2c2c2e;}
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--bg2);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;color:var(--t0);}

/* LOCK */
#lock{position:fixed;inset:0;z-index:9999;background:linear-gradient(160deg,#0f3460,#185FA5 60%,#1D9E75);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;}
.lock-logo{width:72px;height:72px;background:rgba(255,255,255,.15);border-radius:22px;display:flex;align-items:center;justify-content:center;}
.lock-logo i{font-size:38px;color:#fff;}
.lock-title{font-size:24px;font-weight:600;color:#fff;}
.lock-sub{font-size:13px;color:rgba(255,255,255,.7);margin-top:-12px;}
.lock-dots{display:flex;gap:12px;}
.lock-dot{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.3);border:1.5px solid rgba(255,255,255,.6);}
.lock-dot.on{background:#fff;}
.lock-err{font-size:13px;color:#ff6b6b;font-weight:500;min-height:18px;text-align:center;}
.numpad{display:grid;grid-template-columns:repeat(3,72px);gap:10px;}
.nk{height:72px;border-radius:50%;background:rgba(255,255,255,.12);border:none;color:#fff;font-size:22px;font-weight:500;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;}
.nk:active{background:rgba(255,255,255,.25);transform:scale(.94);}
.nk .sub{font-size:9px;letter-spacing:1px;opacity:.6;}
.lock-fp{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.lock-fp i{font-size:32px;color:#fff;}
.lock-fp:active{background:rgba(255,255,255,.25);}
.lock-setup{font-size:12px;color:rgba(255,255,255,.6);text-decoration:underline;cursor:pointer;}

/* APP */
#app{position:fixed;inset:0;display:flex;flex-direction:column;}
.hdr{height:52px;background:var(--bg0);border-bottom:.5px solid var(--bd);flex-shrink:0;display:flex;align-items:center;padding:0 12px;gap:8px;}
.hdr-mid{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;}
.hdr-act{display:flex;gap:6px;}
.mnav-btn{background:none;border:.5px solid var(--bd);border-radius:8px;padding:5px 10px;cursor:pointer;color:var(--t0);font-size:13px;}
.mnav-btn:disabled{opacity:.3;cursor:default;}
.month-lbl{font-size:15px;font-weight:500;min-width:130px;text-align:center;}
.ico-btn{background:none;border:.5px solid var(--bd);border-radius:8px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t1);font-size:17px;}
.ico-btn:hover{background:var(--bg1);}
.ico-btn.on{color:var(--blue);border-color:var(--blue);}
.back-btn{background:none;border:.5px solid var(--bd);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:12px;color:var(--t1);display:flex;align-items:center;gap:4px;white-space:nowrap;}
.scr{flex:1;overflow-y:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch;}
.nav{display:flex;background:var(--bg0);border-top:.5px solid var(--bd);flex-shrink:0;}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:9px 2px 7px;cursor:pointer;gap:3px;border-top:2px solid transparent;}
.ni:hover{background:var(--bg1);}
.ni.on{border-top-color:var(--blue);}
.ni.on .ni-ico,.ni.on .ni-lbl{color:var(--blue);}
.ni-ico{font-size:20px;color:var(--t1);}
.ni-lbl{font-size:9px;color:var(--t1);white-space:nowrap;}

/* BLUR */
body.blur .B{filter:blur(8px);user-select:none;}

/* CARDS */
.card{background:var(--bg0);margin:8px;border-radius:14px;border:.5px solid var(--bd);overflow:hidden;}
.card-hdr{padding:11px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:.5px solid var(--bd);background:var(--bg1);}
.card-title{font-size:11px;font-weight:500;color:var(--t1);text-transform:uppercase;letter-spacing:.6px;display:flex;align-items:center;gap:6px;}
.row{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;border-bottom:.5px solid var(--bd2);}
.row:last-child{border-bottom:none;}
.rl{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}
.rr{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.ico{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.ico.sm{width:28px;height:28px;border-radius:8px;font-size:13px;}
.rname{font-size:14px;font-weight:500;}
.rsub{font-size:11px;color:var(--t1);margin-top:1px;}
.ramt{font-size:14px;font-weight:500;}
.ramt.zero{color:var(--t1);font-weight:400;font-size:13px;}
.edit-btn{background:none;border:.5px solid var(--bd);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;color:var(--t1);white-space:nowrap;}
.edit-btn:hover{background:var(--bg1);}
.del-btn{background:none;border:none;cursor:pointer;color:var(--t1);opacity:.3;padding:4px;font-size:13px;}
.del-btn:hover{opacity:1;color:var(--red);}
.edit-row{background:var(--bg1);padding:10px 16px;border-bottom:.5px solid var(--bd);display:flex;align-items:center;gap:8px;}
.ainput{flex:1;font-size:15px;padding:8px 12px;border:.5px solid var(--bd);border-radius:8px;background:var(--bg0);color:var(--t0);outline:none;}
.save-btn{padding:8px 16px;font-size:13px;border:none;border-radius:8px;color:#fff;cursor:pointer;font-weight:500;}
.cancel-btn{padding:8px 10px;font-size:13px;border:.5px solid var(--bd);border-radius:8px;background:none;cursor:pointer;color:var(--t1);}
.prog-wrap{padding:0 16px 10px;}
.prog{height:4px;background:var(--bd);border-radius:2px;overflow:hidden;}
.prog-f{height:100%;border-radius:2px;}
.add-trig{margin:8px;width:calc(100% - 16px);padding:11px 16px;background:var(--bg0);border:.5px dashed var(--bd);border-radius:14px;cursor:pointer;font-size:13px;color:var(--t1);display:flex;align-items:center;gap:8px;}
.add-trig:hover{background:var(--bg1);}
.add-form{margin:8px;background:var(--bg0);border:.5px solid var(--bd);border-radius:14px;overflow:hidden;}
.afrow{padding:10px 16px;display:flex;gap:8px;align-items:center;border-bottom:.5px solid var(--bd2);}
.afrow:last-child{border-bottom:none;}
.tinput{flex:1;font-size:13px;padding:7px 10px;border:.5px solid var(--bd);border-radius:8px;background:var(--bg1);color:var(--t0);outline:none;}
.tinput:focus{border-color:var(--blue);}
.btn-p{flex:1;padding:9px;font-size:13px;border:none;border-radius:8px;background:var(--blue);color:#fff;cursor:pointer;font-weight:500;}
.btn-s{padding:9px 14px;font-size:13px;border:.5px solid var(--bd);border-radius:8px;background:none;cursor:pointer;color:var(--t1);}
.badge{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:500;}
.badge.pos{background:#E1F5EE;color:#0F6E56;}
.badge.neg{background:#FBEAE3;color:#8F3A1A;}
.badge.neu{background:var(--bg1);color:var(--t1);}
.meter{height:8px;background:var(--bg1);border-radius:4px;overflow:hidden;}
.meter-f{height:100%;border-radius:4px;}

/* PREGLED */
.hero{margin:8px;background:var(--bg0);border-radius:14px;border:.5px solid var(--bd);overflow:hidden;}
.hero-top{padding:18px 16px 14px;}
.hero-lbl{font-size:11px;color:var(--t1);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;}
.hero-val{font-size:36px;font-weight:500;letter-spacing:-.5px;}
.hero-vs{margin-top:8px;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t1);}
.bd-toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-top:.5px solid var(--bd);cursor:pointer;background:var(--bg1);}
.bd-body{border-top:.5px solid var(--bd);}
.bd-row{display:flex;justify-content:space-between;align-items:center;padding:9px 16px;border-bottom:.5px solid var(--bd2);font-size:13px;}
.bd-row:last-child{border-bottom:none;}
.chev{transition:transform .2s;display:inline-block;font-size:13px;color:var(--t1);}
.chev.open{transform:rotate(180deg);}

/* OSTALO sub entries */
.sub-sec{background:var(--bg1);}
.sub-row{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 10px 16px;border-bottom:.5px solid var(--bd2);cursor:pointer;}
.sub-row:hover{background:var(--bg0);}
.entry-zone{background:var(--bg0);border-bottom:.5px solid var(--bd);}
.entry-item{display:flex;align-items:center;padding:8px 12px;border-bottom:.5px solid var(--bd2);gap:8px;}
.entry-name{flex:1;font-size:13px;}
.entry-amt{font-size:13px;font-weight:500;color:var(--red);}
.entry-form{padding:10px 12px;display:flex;gap:6px;align-items:center;border-top:.5px dashed var(--bd);background:var(--bg1);}
.ef-n{flex:1;font-size:13px;padding:7px 10px;border:.5px solid var(--bd);border-radius:8px;background:var(--bg0);color:var(--t0);outline:none;}
.ef-n:focus{border-color:var(--red);}
.ef-i{width:80px;font-size:13px;padding:7px 8px;border:.5px solid var(--bd);border-radius:8px;background:var(--bg0);color:var(--t0);outline:none;text-align:right;}
.ef-i:focus{border-color:var(--red);}
.ef-add{background:var(--red);color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;font-weight:500;white-space:nowrap;}
.sub-total{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--bg0);border-top:.5px solid var(--bd);font-size:13px;font-weight:500;}

/* STEDNJA */
.grp-hdr{padding:9px 16px;display:flex;align-items:center;gap:6px;border-bottom:.5px solid var(--bd);background:var(--bg1);}
.grp-lbl{font-size:11px;font-weight:500;color:var(--t1);text-transform:uppercase;letter-spacing:.6px;}
.grp-tot{margin-left:auto;font-size:12px;font-weight:500;color:var(--blue);}
.acc-row{padding:11px 16px;border-bottom:.5px solid var(--bd2);display:flex;align-items:center;gap:10px;cursor:pointer;}
.acc-row:hover{background:var(--bg1);}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
.stat-c{background:var(--bg1);border-radius:8px;padding:9px 11px;}
.stat-l{font-size:10px;color:var(--t1);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;}
.stat-v{font-size:14px;font-weight:500;}
.ld{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--blue);animation:pulse 1.2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
.refresh-btn{background:none;border:.5px solid var(--bd);border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--t1);display:flex;align-items:center;gap:4px;}

/* HISTORY ROWS */
.hist-row{display:flex;justify-content:space-between;align-items:center;padding:9px 16px;border-bottom:.5px solid var(--bd2);font-size:13px;cursor:pointer;}
.hist-row:hover,.hist-row.on{background:var(--bg1);}
.hist-row:last-child{border-bottom:none;}

/* BANNER */
.banner{margin:8px;border-radius:14px;border:.5px solid;padding:14px 16px;}
</style>
</head>
<body>

<!-- LOCK SCREEN -->
<div id="lock">
  <div class="lock-logo"><i class="ti ti-wallet"></i></div>
  <div class="lock-title">Financije</div>
  <div class="lock-sub">Unesi PIN ili otisak prsta</div>
  <div class="lock-dots" id="dots">
    <div class="lock-dot" id="d0"></div><div class="lock-dot" id="d1"></div>
    <div class="lock-dot" id="d2"></div><div class="lock-dot" id="d3"></div>
  </div>
  <div class="lock-err" id="lerr"></div>
  <div class="lock-fp" onclick="tryBio()" title="Otisak prsta"><i class="ti ti-fingerprint"></i></div>
  <div class="numpad" id="numpad"></div>
  <div class="lock-setup" onclick="setupPin()">Postavi PIN</div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <div class="hdr" id="hdr"></div>
  <div class="scr" id="scr"></div>
  <nav class="nav">
    <div class="ni on" id="ni-pregled" onclick="go('pregled')"><i class="ti ti-layout-dashboard ni-ico"></i><span class="ni-lbl">Pregled</span></div>
    <div class="ni" id="ni-prihodi" onclick="go('prihodi')"><i class="ti ti-arrow-down-circle ni-ico"></i><span class="ni-lbl">Prihodi</span></div>
    <div class="ni" id="ni-rashodi" onclick="go('rashodi')"><i class="ti ti-arrow-up-circle ni-ico"></i><span class="ni-lbl">Rashodi</span></div>
    <div class="ni" id="ni-rezije" onclick="go('rezije')"><i class="ti ti-bolt ni-ico"></i><span class="ni-lbl">Režije</span></div>
    <!-- STEDNJA SKRIVENA - podaci sacuvani, vratiti kad bude spremo
    <div class="ni" id="ni-stednja" onclick="go('stednja')"><i class="ti ti-piggy-bank ni-ico"></i><span class="ni-lbl">Štednja</span></div>
    -->
  </nav>
</div>

<script>
// ── CONSTANTS ──────────────────────────────────────────────
const YEAR = 2026;
const START_MONTH = 5; // Lipanj = index 5
const MNAMES = ['Siječanj','Veljača','Ožujak','Travanj','Svibanj','Lipanj','Srpanj','Kolovoz','Rujan','Listopad','Studeni','Prosinac'];
const MS = ['Sij','Velj','Ožu','Tra','Svi','Lip','Srp','Kol','Ruj','Lis','Stu','Pro'];

// ── STATE ──────────────────────────────────────────────────
let scr = 'pregled';
let mon = START_MONTH;
let hidden = false;
let detailAcc = null;
let bdOpen = false;
let ostaloOpen = false;
let openSubKey = null;
let editKey = null;
let editEntryId = null;
let addingIncome = false;
let addingMain = false;
let addingSub = false;
let addingRezija = false;
let addingHolding = false;
let pinEntry = '';
let pinSetup = false;
let pinSetupStep = 0;
let pinSetupFirst = '';
let eurUsd = 1.08;
let loadingPrices = false;

// ── DATA SCHEMA ────────────────────────────────────────────
function emptyMonth() {
  return {
    pocetno: 0,
    income: { placa:0, najamnina:0, bonus:0, regres:0, bozicnica:0, poklon:0, ostalo:0, custom:{} },
    expenses: { domacinstvo:0, stednja:0, mastercard:0, prijevoz:0, mobitel:0, custom:{} },
    // ostalo: each key is an array of {id,naziv,iznos}
    ostalo: { sport:[], hrana:[], izlazak:[], odjeca:[], zdravlje:[], auto:[], poklon:[], ivan:[], youtube:[], ostalo:[], custom:{} },
    rezije: { hep:0, termoplin:0, magic:0, kom:0, varkom:0, cistoca:0, custom:{} },
  };
}

let D = {}; // main data store

function loadData() {
  try {
    const raw = localStorage.getItem('fin26_v2');
    if (raw) D = JSON.parse(raw);
  } catch(e) { D = {}; }
  // ensure all months exist and have correct schema
  for (let m = START_MONTH; m < 12; m++) {
    if (!D[m]) D[m] = emptyMonth();
    else fixMonth(D[m]);
  }
}

function fixMonth(m) {
  if (!m.income) m.income = emptyMonth().income;
  if (!m.expenses) m.expenses = emptyMonth().expenses;
  if (!m.rezije) m.rezije = emptyMonth().rezije;
  if (typeof m.pocetno !== 'number') m.pocetno = 0;
  // fix ostalo — ensure array format
  const oKeys = ['sport','hrana','izlazak','odjeca','zdravlje','auto','poklon','ivan','youtube','ostalo'];
  if (!m.ostalo) m.ostalo = emptyMonth().ostalo;
  oKeys.forEach(k => {
    if (!Array.isArray(m.ostalo[k])) {
      const v = typeof m.ostalo[k] === 'number' ? m.ostalo[k] : 0;
      m.ostalo[k] = v > 0 ? [{id:'m'+k,naziv:k,iznos:v}] : [];
    }
  });
  if (!m.ostalo.custom) m.ostalo.custom = {};
  if (!m.income.custom) m.income.custom = {};
  if (!m.expenses.custom) m.expenses.custom = {};
  if (!m.rezije.custom) m.rezije.custom = {};
}

function save() {
  try { localStorage.setItem('fin26_v2', JSON.stringify(D)); } catch(e) {}
}

function md(m) { return D[m !== undefined ? m : mon] || emptyMonth(); }

// ── PORTFOLIO DATA ─────────────────────────────────────────
const PORT_DEFAULT = {
  accounts: [
    {id:'go',    lbl:'GO (gotovina)',       ico:'ti-cash',             bg:'#E1F5EE',tc:'#0F6E56',grp:'lik',  type:'cash',   hist:{},holdings:[]},
    {id:'rba',   lbl:'RBA račun',           ico:'ti-building-bank',    bg:'#E6F1FB',tc:'#185FA5',grp:'lik',  type:'cash',   hist:{},holdings:[]},
    {id:'ib',    lbl:'Interactive Brokers', ico:'ti-chart-candlestick',bg:'#EEEDFE',tc:'#534AB7',grp:'inv',  type:'stocks', hist:{},holdings:[
      {id:'h1',ticker:'VOO', isin:'US9229083632',name:'Vanguard S&P 500 ETF',qty:0,price:null,chg:null},
      {id:'h2',ticker:'AAPL',isin:'US0378331005',name:'Apple Inc.',         qty:0,price:null,chg:null},
    ]},
    {id:'ledger',lbl:'Ledger',             ico:'ti-cpu',              bg:'#FAEEDA',tc:'#854F0B',grp:'inv',  type:'crypto', hist:{},holdings:[
      {id:'h3',sym:'bitcoin',lbl:'BTC',name:'Bitcoin',qty:0,price:null,chg:null},
    ]},
    {id:'oroc',  lbl:'Oročeno',            ico:'ti-lock',             bg:'#E1F5EE',tc:'#0F6E56',grp:'oroc', type:'cash',   hist:{},holdings:[]},
    {id:'rba3',  lbl:'RBA III. mirovinski',ico:'ti-shield-check',     bg:'#E6F1FB',tc:'#185FA5',grp:'oroc', type:'cash',   hist:{},holdings:[]},
    {id:'ivb',   lbl:'Ivan Binance',       ico:'ti-currency-bitcoin', bg:'#FAEEDA',tc:'#854F0B',grp:'ivan', type:'crypto', hist:{},holdings:[
      {id:'h4',sym:'bitcoin', lbl:'BTC',name:'Bitcoin', qty:0,price:null,chg:null},
      {id:'h5',sym:'ethereum',lbl:'ETH',name:'Ethereum',qty:0,price:null,chg:null},
    ]},
    {id:'ivrs',  lbl:'Ivan Revolut — Dionice',ico:'ti-credit-card',   bg:'#FBEAF0',tc:'#993556',grp:'ivan', type:'stocks', hist:{},holdings:[
      {id:'h6',ticker:'TSLA',isin:'US88160R1014',name:'Tesla Inc.',   qty:0,price:null,chg:null},
      {id:'h7',ticker:'NVDA',isin:'US67066G1040',name:'NVIDIA Corp.', qty:0,price:null,chg:null},
    ]},
    {id:'ivrc',  lbl:'Ivan Revolut — Kripto',ico:'ti-brand-revolut',  bg:'#FBEAF0',tc:'#993556',grp:'ivan', type:'crypto', hist:{},holdings:[
      {id:'h8',sym:'ethereum',lbl:'ETH',name:'Ethereum',qty:0,price:null,chg:null},
    ]},
  ]
};
const GRPS = [
  {key:'lik', lbl:'Likvidno',           ico:'ti-cash'},
  {key:'inv', lbl:'Investicije',        ico:'ti-chart-candlestick'},
  {key:'oroc',lbl:'Oročeno & Mirov.',   ico:'ti-lock'},
  {key:'ivan',lbl:'Ivan',               ico:'ti-user'},
];

let PORT = {};
function loadPort() {
  try { const r=localStorage.getItem('fin26_port'); if(r) PORT=JSON.parse(r); } catch(e){}
  if(!PORT.accounts) PORT=JSON.parse(JSON.stringify(PORT_DEFAULT));
}
function savePort() { try{localStorage.setItem('fin26_port',JSON.stringify(PORT));}catch(e){} }
function accVal(a) {
  const hs=a.holdings||[];
  if(hs.length>0&&hs.every(h=>h.price!=null)) return hs.reduce((s,h)=>s+h.price*h.qty,0);
  return a.hist[mon]||0;
}
function totalPort() { return PORT.accounts.reduce((s,a)=>s+accVal(a),0); }

// ── FORMATTERS ─────────────────────────────────────────────
function f(n,d=2){if(!n&&n!==0)return'—';return Math.abs(n).toLocaleString('hr',{minimumFractionDigits:d,maximumFractionDigits:d})+' €';}
function fs(n){return Math.round(Math.abs(n)).toLocaleString('hr')+' €';}
function pct(a,b){return b>0?a/b*100:0;}

// ── TOTALS ────────────────────────────────────────────────
function totIncome(m){
  m=m!==undefined?m:mon;
  const inc=md(m).income;
  let t=['placa','najamnina','bonus','regres','bozicnica','poklon','ostalo'].reduce((s,k)=>s+(inc[k]||0),0);
  Object.values(inc.custom||{}).forEach(v=>t+=v.amount||0);
  return t;
}
function totOstaloKey(key,m){
  m=m!==undefined?m:mon;
  const v=md(m).ostalo[key];
  if(Array.isArray(v)) return v.reduce((s,e)=>s+(e.iznos||0),0);
  return 0;
}
function totOstalo(m){
  m=m!==undefined?m:mon;
  const o=md(m).ostalo;
  const keys=['sport','hrana','izlazak','odjeca','zdravlje','auto','poklon','ivan','youtube','ostalo'];
  let t=keys.reduce((s,k)=>s+totOstaloKey(k,m),0);
  Object.values(o.custom||{}).forEach(v=>{
    const en=v.entries||[];
    t+=en.reduce((s,e)=>s+(e.iznos||0),0);
  });
  return t;
}
function totExp(m){
  m=m!==undefined?m:mon;
  const exp=md(m).expenses;
  let t=['domacinstvo','stednja','mastercard','prijevoz','mobitel'].reduce((s,k)=>s+(exp[k]||0),0);
  Object.values(exp.custom||{}).forEach(v=>t+=v.amount||0);
  return t+totOstalo(m);
}
function totRez(m){
  m=m!==undefined?m:mon;
  const r=md(m).rezije;
  let t=['hep','termoplin','magic','kom','varkom','cistoca'].reduce((s,k)=>s+(r[k]||0),0);
  Object.values(r.custom||{}).forEach(v=>t+=v.amount||0);
  return t;
}
function saldo(m){
  m=m!==undefined?m:mon;
  const d=md(m);
  const exp=d.expenses;
  return d.pocetno+totIncome(m)-(exp.domacinstvo||0)-(exp.stednja||0)-(exp.mastercard||0)-(exp.prijevoz||0)-(exp.mobitel||0)-totOstalo(m);
}

// ── SPARKLINE ─────────────────────────────────────────────
function spark(vals,col,w=60,h=24){
  const v=vals.filter(x=>x!=null);if(v.length<2)return'';
  const mn=Math.min(...v),mx=Math.max(...v),rng=mx-mn||1;
  const pts=v.map((x,i)=>`${(i/(v.length-1)*w).toFixed(1)},${(h-((x-mn)/rng)*(h-4)-2).toFixed(1)}`).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
function bars(vals,col,w=316,h=80){
  const n=vals.length,bw=Math.floor((w-(n-1)*5)/n),mx=Math.max(...vals,1);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${vals.map((v,i)=>{
    const bh=Math.max(3,(v/mx)*(h-18)),x=i*(bw+5),y=h-18-bh;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="3" fill="${col}" opacity="${i===mon-START_MONTH?'1':'0.4'}"/>
    <text x="${x+bw/2}" y="${h-3}" text-anchor="middle" font-size="9" fill="var(--t1)">${MS[START_MONTH+i]}</text>`;
  }).join('')}</svg>`;
}

// ── EDIT HELPERS ──────────────────────────────────────────
function erow(key,val,col,saveFn,cancelFn){
  return `<div class="edit-row">
    <input class="ainput" id="ei_${key}" type="number" min="0" step="0.01" value="${val||''}" placeholder="0.00"
      style="border-color:${col}" onkeydown="if(event.key==='Enter')${saveFn}"/>
    <span style="font-size:12px;color:var(--t1)">€</span>
    <button class="cancel-btn" onclick="${cancelFn}">✕</button>
    <button class="save-btn" onclick="${saveFn}" style="background:${col}">Spremi</button>
  </div>`;
}

function makeRow(cfg){
  const {key,lbl,ico,bg,tc,amt,total,type,color,fixed,isEditing,saveFn,delFn}=cfg;
  const isZero=!amt||amt===0;
  const p=total>0&&amt>0?pct(amt,total):null;
  return `
  <div class="row" style="${isEditing?'border-bottom:none':''}">
    <div class="rl">
      <div class="ico" style="background:${bg};color:${tc}"><i class="ti ${ico}"></i></div>
      <div>
        <div class="rname">${lbl}</div>
        <div class="rsub">${isZero?'Nije uneseno':p!=null?p.toFixed(1)+'% od ukupnog':''}</div>
      </div>
    </div>
    <div class="rr">
      <span class="ramt B ${isZero?'zero':''}" style="${!isZero?'color:'+color:''}">${isZero?'—':f(amt)}</span>
      <button class="edit-btn" onclick="editKey=editKey==='${key}'?null:'${key}';render()">${isEditing?'Zatvori':'Uredi'}</button>
      ${!fixed&&delFn?`<button class="del-btn" onclick="${delFn}"><i class="ti ti-x"></i></button>`:''}
    </div>
  </div>
  ${isEditing?erow(key,amt,color,saveFn,"editKey=null;render()"):''}
  ${amt>0&&!isEditing&&p!=null?`<div class="prog-wrap"><div class="prog"><div class="prog-f" style="width:${p}%;background:${tc}"></div></div></div>`:''}`;
}

}
function saveExp(key){

  else if(exp.custom[key]) exp.custom[key].amount=v;
  editKey=null;save();render();
}
function saveRez(key){
  const v=parseFloat(document.getElementById('ei_'+key)?.value)||0;

// ── ENTRY FUNCTIONS (Ostalo) ──────────────────────────────
function addEntry(catKey, isBase) {
  const nEl=document.getElementById('en_'+catKey);
  const iEl=document.getElementById('ei2_'+catKey);
  if(!nEl||!iEl) return;
  const naziv=(nEl.value||'').trim();
  const iznos=parseFloat(iEl.value)||0;
  if(!naziv&&!iznos) return;
  const entry={id:'e'+Date.now(), naziv:naziv||'Upit', iznos};
  const o=md().ostalo;
  if(isBase==='1') {
    if(!Array.isArray(o[catKey])) o[catKey]=[];
    o[catKey].push(entry);
  } else {
    if(!o.custom[catKey]) o.custom[catKey]={lbl:catKey,entries:[]};
    if(!Array.isArray(o.custom[catKey].entries)) o.custom[catKey].entries=[];
    o.custom[catKey].entries.push(entry);
  }
  save(); render();
}
function deleteEntry(catKey, entryId, isBase){
  const o=md().ostalo;
  if(isBase==='1') o[catKey]=o[catKey].filter(e=>e.id!==entryId);
  else o.custom[catKey].entries=o.custom[catKey].entries.filter(e=>e.id!==entryId);
  save();render();
}
function editEntry(catKey, entryId, isBase){
  const iEl=document.getElementById('ee_'+entryId);
  if(!iEl) return;
  const iznos=parseFloat(iEl.value)||0;
  const o=md().ostalo;
  const arr=isBase==='1'?o[catKey]:o.custom[catKey].entries;
  const e=arr.find(e=>e.id===entryId);
  if(e) e.iznos=iznos;
  editEntryId=null;save();render();
}

function renderRashodi(){
  const exp=md().expenses,tE=totExp(),tO=totOstalo();
  const customExp=Object.entries(exp.custom||{}).map(([k,v])=>({key:k,lbl:v.label||k,ico:'ti-tag',bg:'#F1EFE8',tc:'#5F5E5A',fixed:false,amt:v.amount||0}));
  let html=`<div class="banner" style="background:#FBEAE3;border-color:#F0B89E;display:flex;justify-content:space-between;align-items:center;">
    <span style="font-size:12px;color:#8F3A1A;text-transform:uppercase;letter-spacing:.5px;font-weight:500">Ukupni rashodi</span>
    <span style="font-size:22px;font-weight:500;color:#8F3A1A" class="B">${fs(tE)}</span>
  </div><div class="card">`;

  // main cats
  [...EXP_CATS.map(c=>({...c,fixed:true})),...customExp].forEach(c=>{
    const amt=c.fixed?(exp[c.key]||0):(c.amt||0);
    html+=makeRow({key:c.key,lbl:c.lbl,ico:c.ico,bg:c.bg,tc:c.tc,amt,total:tE,color:'var(--red)',fixed:c.fixed,

  });

  // OSTALO expandable
  const oActiveSubs=OSUB.filter(c=>totOstaloKey(c.key)>0).length;
  const oPct=tE>0?pct(tO,tE):0;
  html+=`<div class="sub-row ${ostaloOpen?'open':''}" onclick="ostaloOpen=!ostaloOpen;openSubKey=null;render()" style="${ostaloOpen?'background:var(--bg0);border-bottom:none':''}">
    <div class="rl">
      <div class="ico sm" style="background:#FBEAF0;color:#993556"><i class="ti ti-dots-circle"></i></div>
      <div><div style="font-size:13px;font-weight:500">Ostalo</div>
        <div class="rsub">${tO>0?oPct.toFixed(1)+'% · '+oActiveSubs+' kategorija':'Nije uneseno'}</div>
      </div>
    </div>
    <div class="rr">
      <span class="ramt B ${!tO?'zero':''}" style="${tO?'color:var(--red)':''}">${tO?f(tO):'—'}</span>
      <i class="ti ti-chevron-${ostaloOpen?'up':'down'}" style="font-size:13px;color:var(--t1);opacity:.6"></i>
    </div>
  </div>
  ${!ostaloOpen&&tO>0?`<div class="prog-wrap"><div class="prog"><div class="prog-f" style="width:${oPct}%;background:#993556"></div></div></div>`:''}
  ${ostaloOpen?renderOstaloSub(tE):''}
  </div>`;

  if(!addingMain){
    html+=`<button class="add-trig" onclick="addingMain=true;render()"><i class="ti ti-plus"></i> Dodaj kategoriju rashoda</button>`;
  } else {
    html+=`<div class="add-form">
      <div class="afrow"><i class="ti ti-tag" style="color:var(--t1)"></i><input class="tinput" id="nm_n" placeholder="Naziv..."/></div>
      <div class="afrow"><i class="ti ti-currency-euro" style="color:var(--t1)"></i><input class="tinput" id="nm_a" type="number" min="0" step="0.01" placeholder="Iznos (€)"/>
      <button class="btn-s" onclick="addingMain=false;render()">✕</button>
      <button class="btn-p" style="flex:0;padding:7px 14px" onclick="addExpCat()">Dodaj</button></div>
    </div>`;
  }

function addExpCat(){
  const n=document.getElementById('nm_n')?.value.trim();if(!n)return;
  const k='c'+Date.now();
  md().expenses.custom[k]={label:n,amount:parseFloat(document.getElementById('nm_a')?.value)||0};
  addingMain=false;save();render();
}
function delExpCat(k){delete md().expenses.custom[k];save();render();}

function renderOstaloSub(tE){
  const o=md().ostalo,tO=totOstalo();
  const customSub=Object.entries(o.custom||{}).map(([k,v])=>({key:k,lbl:v.lbl||k,ico:'ti-tag',bg:'#F1EFE8',tc:'#5F5E5A',fixed:false,entries:v.entries||[]}));
  let html=`<div class="sub-sec">`;

  [...OSUB.map(c=>({...c,fixed:true})),...customSub].forEach(c=>{
    const entries=c.fixed?(Array.isArray(o[c.key])?o[c.key]:[]):(c.entries||[]);
    const amt=entries.reduce((s,e)=>s+(e.iznos||0),0);
    const isOpen=openSubKey===c.key;
    const p=tO>0&&amt>0?pct(amt,tO):null;
    const isBase=c.fixed?'1':'0';

    // sub category row
    html+=`<div style="display:flex;align-items:center;justify-content:space-between;padding:9px 16px;border-bottom:.5px solid var(--bd2);cursor:pointer;background:${isOpen?'var(--bg0)':'var(--bg1)'}"
      onclick="openSubKey=openSubKey==='${c.key}'?null:'${c.key}';render()">
      <div class="rl">
        <div class="ico sm" style="background:${c.bg};color:${c.tc}"><i class="ti ${c.ico}"></i></div>
        <div>
          <div style="font-size:13px;font-weight:500">${c.lbl}</div>
          <div class="rsub">${entries.length?entries.length+' upis'+(entries.length>1?'a':'')+(amt?' · '+f(amt):''):'Nema upisa'}</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="B" style="font-size:13px;font-weight:500;color:${amt?'var(--red)':'var(--t1)'}">${amt?f(amt):'—'}</span>
        ${!c.fixed?`<button onclick="event.stopPropagation();delOstaloCat('${c.key}')" class="del-btn"><i class="ti ti-x"></i></button>`:''}
        <i class="ti ti-chevron-${isOpen?'up':'down'}" style="font-size:12px;color:var(--t1);opacity:.5"></i>
      </div>
    </div>`;

    // expanded entry list
    if(isOpen){
      html+=`<div class="entry-zone">`;
      if(entries.length===0){
        html+=`<div style="padding:8px 16px;font-size:12px;color:var(--t1)">Nema upisa — dodaj ispod</div>`;
      } else {
        entries.forEach(e=>{
          const isEditE=editEntryId===e.id;
          html+=`<div class="entry-item">
            <div class="entry-name">${e.naziv}</div>
            ${isEditE
              ? `<input id="ee_${e.id}" type="number" min="0" step="0.01" value="${e.iznos}"
                  style="width:80px;font-size:13px;padding:4px 8px;border:.5px solid var(--red);border-radius:6px;background:var(--bg0);color:var(--t0);outline:none"
                  onkeydown="if(event.key==='Enter')editEntry('${c.key}','${e.id}','${isBase}')"/>
                 <button onclick="editEntry('${c.key}','${e.id}','${isBase}')" style="background:var(--red);color:#fff;border:none;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer">OK</button>
                 <button onclick="editEntryId=null;render()" style="background:none;border:.5px solid var(--bd);border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer">✕</button>`
              : `<span class="entry-amt B">${f(e.iznos)}</span>
                 <button onclick="editEntryId='${e.id}';render()" class="edit-btn" style="padding:4px 8px;font-size:11px">Uredi</button>`
            }
            <button onclick="deleteEntry('${c.key}','${e.id}','${isBase}')" class="del-btn"><i class="ti ti-x"></i></button>
          </div>`;
        });
      }
      // ADD ENTRY FORM
      html+=`<div class="entry-form">
        <input class="ef-n" id="en_${c.key}" type="text" placeholder="Naziv upisa..." maxlength="40"
          onkeydown="if(event.key==='Tab'){event.preventDefault();document.getElementById('ei2_${c.key}').focus();}"/>
        <input class="ef-i" id="ei2_${c.key}" type="number" min="0" step="0.01" placeholder="€"
          onkeydown="if(event.key==='Enter')addEntry('${c.key}','${isBase}')"/>
        <button class="ef-add" onclick="addEntry('${c.key}','${isBase}')">+</button>
      </div>`;
      if(amt>0&&p) html+=`<div style="padding:0 16px 8px"><div class="prog"><div class="prog-f" style="width:${p}%;background:${c.tc}"></div></div></div>`;
      html+=`</div>`;
    } else if(amt>0&&p){
      html+=`<div class="prog-wrap" style="padding-left:16px"><div class="prog"><div class="prog-f" style="width:${p}%;background:${c.tc}"></div></div></div>`;
    }
  });

  html+=`<div class="sub-total"><span>Ukupno Ostalo</span><span class="B">${f(tO)}</span></div>`;
  if(!addingSub){
    html+=`<div style="display:flex;align-items:center;gap:8px;padding:9px 16px;cursor:pointer;border-top:.5px dashed var(--bd)" onclick="addingSub=true;render()">
      <i class="ti ti-plus" style="color:var(--t1)"></i><span style="font-size:13px;color:var(--t1)">Dodaj podkategoriju</span>
    </div>`;
  } else {
    html+=`<div style="display:flex;gap:6px;padding:9px 16px;border-top:.5px solid var(--bd)">
      <input class="tinput" id="ns_n" placeholder="Naziv kategorije..." style="font-size:12px;padding:5px 8px"/>
      <button class="btn-s" onclick="addingSub=false;render()" style="padding:5px 8px">✕</button>
      <button class="save-btn" onclick="addOstaloCat()" style="background:var(--red);padding:5px 12px;font-size:12px">Dodaj</button>
    </div>`;
  }
  html+=`</div>`;
  return html;
}
function addOstaloCat(){
  const n=document.getElementById('ns_n')?.value.trim();if(!n)return;
  const k='c'+Date.now();
  md().ostalo.custom[k]={lbl:n,entries:[]};
  addingSub=false;save();render();
}
function delOstaloCat(k){delete md().ostalo.custom[k];save();render();}

  const customRez=Object.entries(r.custom||{}).map(([k,v])=>({key:k,lbl:v.label||k,ico:'ti-tag',bg:'#F1EFE8',tc:'#5F5E5A',fixed:false,amt:v.amount||0}));
  let html=`<div class="banner" style="background:var(--orange-bg);border-color:var(--orange-bd)">

    </div>
  </div><div class="card">`;

      isEditing:editKey===c.key,saveFn:`saveRez('${c.key}')`,delFn:`delRezCat('${c.key}')`});

  // history

    const t=totRez(m),tp=m>START_MONTH?totRez(m-1):null,diff=tp!=null?t-tp:null;
    html+=`<div class="hist-row ${m===mon?'on':''}" onclick="mon=${m};editKey=null;render()">
      <span style="${m===mon?'font-weight:500':''}color:var(--t1)">${MS[m]} ${YEAR}</span>
      <span class="B" style="${m===mon?'color:var(--orange);font-weight:500':''}">${t?f(t):'—'}</span>
      <span style="font-size:11px;color:${diff==null?'var(--t1)':diff<=0?'var(--green)':'var(--red)'}">${diff!=null?(diff<=0?'▼':'▲')+f(Math.abs(diff)):''}</span>

      <div class="afrow"><i class="ti ti-tag" style="color:var(--t1)"></i><input class="tinput" id="nr_n" placeholder="Naziv..."/></div>

      <button class="btn-s" onclick="addingRezija=false;render()">✕</button>

function renderStednja(){
  if(detailAcc) return renderAccDetail(detailAcc);
  const d=md(),tI=totIncome(),tPort=totalPort();
  const sp=pct(d.expenses.stednja,tI);
  let html=`<div style="margin:8px;background:#E6F1FB;border-radius:14px;border:.5px solid #B5D4F4;padding:14px 16px;">
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <div><div style="font-size:11px;color:var(--blue);text-transform:uppercase;letter-spacing:.5px;font-weight:500;margin-bottom:4px">Ukupni portfelj</div>
        <div style="font-size:26px;font-weight:500;color:#124D8A" class="B">${fs(tPort)} ${loadingPrices?'<span class="ld"></span>':''}</div></div>
      <button class="refresh-btn" onclick="refreshPrices()"><i class="ti ti-refresh"></i> Osvježi</button>
    </div>
    <div class="stat-grid">
      <div class="stat-c"><div class="stat-l">Štednja ovaj mj.</div><div class="stat-v B">${fs(d.expenses.stednja)}</div></div>
      <div class="stat-c"><div class="stat-l">Stopa štednje</div><div class="stat-v" style="color:var(--green)">${sp.toFixed(1)}%</div></div>
      <div class="stat-c"><div class="stat-l">Početno stanje</div><div class="stat-v B">${fs(d.pocetno)}</div></div>
      <div class="stat-c"><div class="stat-l">Saldo</div><div class="stat-v B" style="color:${saldo()>=0?'var(--green)':'var(--red)'}">${saldo()<0?'–':''}${fs(Math.abs(saldo()))}</div></div>
    </div>
  </div><div class="card">`;

  GRPS.forEach(g=>{
    const accs=PORT.accounts.filter(a=>a.grp===g.key);
    const gt=accs.reduce((s,a)=>s+accVal(a),0);
    html+=`<div class="grp-hdr"><i class="ti ${g.ico}" style="font-size:13px;color:var(--t1)"></i>
      <span class="grp-lbl">${g.lbl}</span><span class="grp-tot B">${gt>0?fs(gt):'—'}</span></div>`;
    accs.forEach(a=>{
      const v=accVal(a);
      const histVals=Array.from({length:mon-START_MONTH+1},(_,i)=>a.hist[START_MONTH+i]||0);
      const prevV=a.hist[mon-1]||0;const delta=prevV>0?((v-prevV)/prevV*100):null;
      html+=`<div class="acc-row" onclick="detailAcc='${a.id}';render()">
        <div class="ico" style="background:${a.bg};color:${a.tc}"><i class="ti ${a.ico}"></i></div>
        <div style="flex:1;min-width:0">
          <div style="font-size:14px;font-weight:500">${a.lbl}</div>
          <div class="rsub">${(a.holdings||[]).length>0?(a.holdings.length+' pozicija'):'Stanje računa'}</div>
        </div>
        <div style="margin-right:8px">${spark(histVals,a.tc)}</div>
        <div style="text-align:right;flex-shrink:0">
          <div style="font-size:14px;font-weight:500;color:${v?'var(--blue)':'var(--t1)'}" class="B">${v?fs(v):'—'}</div>
          ${delta!=null?`<div style="font-size:11px;color:${delta>=0?'var(--green)':'var(--red)'}">${delta>=0?'▲':'▼'}${Math.abs(delta).toFixed(1)}%</div>`:''}
        </div>
        <i class="ti ti-chevron-right" style="font-size:13px;color:var(--t1);opacity:.4;margin-left:4px"></i>
      </div>`;
    });
  });
  html+='</div>';
  return html;
}

function renderAccDetail(accId){
  const a=PORT.accounts.find(x=>x.id===accId);if(!a)return'';
  const v=accVal(a);
  const histVals=Array.from({length:Math.max(mon-START_MONTH+1,1)},(_,i)=>a.hist[START_MONTH+i]||0);
  const h0=histVals[0];
  const ytd=h0>0?((v-h0)/h0*100):null;
  let html=`<div style="margin:8px;background:var(--bg0);border-radius:14px;border:.5px solid var(--bd);padding:16px;">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
      <div class="ico" style="background:${a.bg};color:${a.tc};width:44px;height:44px;border-radius:13px;font-size:20px"><i class="ti ${a.ico}"></i></div>
      <div><div style="font-size:18px;font-weight:500">${a.lbl}</div>
        <div class="rsub">${a.type==='stocks'?'Dionice & ETF':a.type==='crypto'?'Kriptovalute':'Gotovinski račun'}</div></div>
    </div>
    <div style="font-size:30px;font-weight:500;color:#124D8A;margin-bottom:4px" class="B">${v>0?fs(v):'—'} ${loadingPrices?'<span class="ld"></span>':''}</div>
    <div class="stat-grid">
      <div class="stat-c"><div class="stat-l">Početno (${MS[START_MONTH]})</div><div class="stat-v B">${fs(h0)}</div></div>
      <div class="stat-c"><div class="stat-l">Zadnje stanje</div><div class="stat-v B">${fs(histVals[histVals.length-1])}</div></div>
      <div class="stat-c"><div class="stat-l">Rast YTD</div><div class="stat-v" style="color:${ytd!=null?(ytd>=0?'var(--green)':'var(--red)'):'var(--t1)'}">${ytd!=null?ytd.toFixed(1)+'%':'—'}</div></div>
      <div class="stat-c"><div class="stat-l">Promjena €</div><div class="stat-v B">${h0>0?(v>=h0?'+':'–')+fs(Math.abs(v-h0)):'—'}</div></div>
    </div>
  </div>`;

  // bar chart
  html+=`<div class="card"><div class="card-hdr"><span class="card-title">Kumulativ po mjesecima</span>
    <button class="edit-btn" onclick="editAccHist('${a.id}')">Uredi stanja</button></div>
    <div style="padding:12px 16px 8px">${bars(histVals,a.tc)}</div>
  </div>`;

  // month history
  html+=`<div class="card"><div class="grp-hdr"><span class="grp-lbl">Stanje po mjesecima</span></div>`;
  histVals.forEach((hv,i)=>{
    const m2=START_MONTH+i,pv=i>0?histVals[i-1]:null,diff=pv!=null&&pv>0?((hv-pv)/pv*100):null;
    html+=`<div class="hist-row" style="${m2===mon?'background:var(--bg1)':''}">
      <span style="color:var(--t1)">${MS[m2]} ${YEAR}</span>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="B" style="font-weight:500">${fs(hv)}</span>
        <button class="edit-btn" style="padding:3px 8px;font-size:11px" onclick="editAccMonth('${a.id}',${m2})">Uredi</button>
      </div>
      <span style="font-size:11px;color:${diff==null?'var(--t1)':diff>=0?'var(--green)':'var(--red)'}">${diff!=null?(diff>=0?'+':'')+diff.toFixed(1)+'%':''}</span>
    </div>`;
  });
  html+='</div>';

  // holdings
  if((a.holdings||[]).length>0){
    html+=`<div class="card"><div class="grp-hdr"><span class="grp-lbl">${a.type==='stocks'?'Dionice / ETF':'Kriptovalute'}</span>
      <button class="refresh-btn" onclick="refreshPrices()"><i class="ti ti-refresh"></i></button></div>`;
    a.holdings.forEach(h=>{
      const hv=h.price!=null?h.price*h.qty:null;
      html+=`<div style="display:flex;align-items:center;padding:10px 16px;border-bottom:.5px solid var(--bd2);gap:10px">
        <div style="width:30px;height:30px;border-radius:8px;background:${a.bg};color:${a.tc};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0">${a.type==='stocks'?h.ticker?.substring(0,3):h.lbl}</div>
        <div style="flex:1"><div style="font-size:13px;font-weight:500">${h.name}</div>
          <div class="rsub">${a.type==='stocks'?h.qty+' kom · '+(h.price?f(h.price):'—'):(h.qty+' '+h.lbl+' · '+(h.price?f(h.price):'—'))}/kom${h.isin?' · '+h.isin:''}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:13px;font-weight:500;color:var(--blue)" class="B">${hv!=null?f(hv):(loadingPrices?'<span class="ld"></span>':'—')}</div>
          ${h.chg!=null?`<div style="font-size:11px;color:${h.chg>=0?'var(--green)':'var(--red)'}">${h.chg>=0?'+':''}${h.chg.toFixed(2)}%</div>`:''}
        </div>
        <button class="del-btn" onclick="delHolding('${a.id}','${h.id}')"><i class="ti ti-x"></i></button>
      </div>`;
    });
    if(!addingHolding){
      html+=`</div><button class="add-trig" onclick="addingHolding=true;render()"><i class="ti ti-plus"></i> Dodaj ${a.type==='stocks'?'dionicu / ETF':'kriptovalutu'}</button>`;
    } else {
      html+=`</div><div class="add-form">`;
      if(a.type==='stocks'){
        html+=`<div class="afrow"><span style="font-size:12px;color:var(--t1);width:60px;flex-shrink:0">Ticker</span><input class="tinput" id="ht" placeholder="AAPL, VOO..." style="text-transform:uppercase"/></div>
               <div class="afrow"><span style="font-size:12px;color:var(--t1);width:60px;flex-shrink:0">ISIN</span><input class="tinput" id="hi" placeholder="opciono"/></div>
               <div class="afrow"><span style="font-size:12px;color:var(--t1);width:60px;flex-shrink:0">Naziv</span><input class="tinput" id="hn" placeholder="Apple Inc."/></div>
               <div class="afrow"><span style="font-size:12px;color:var(--t1);width:60px;flex-shrink:0">Kom.</span><input class="tinput" id="hq" type="number" min="0" step="0.0001" placeholder="10"/></div>`;
      } else {
        html+=`<div class="afrow"><span style="font-size:12px;color:var(--t1);width:60px;flex-shrink:0">CoinGecko</span><input class="tinput" id="hs" placeholder="bitcoin, ethereum..."/></div>
               <div class="afrow"><span style="font-size:12px;color:var(--t1);width:60px;flex-shrink:0">Oznaka</span><input class="tinput" id="hl" placeholder="BTC, ETH..." style="text-transform:uppercase"/></div>
               <div class="afrow"><span style="font-size:12px;color:var(--t1);width:60px;flex-shrink:0">Količina</span><input class="tinput" id="hq" type="number" min="0" step="0.00000001" placeholder="0.05"/></div>`;
      }
      html+=`<div style="display:flex;gap:8px;padding:10px 16px">
        <button class="btn-s" onclick="addingHolding=false;render()">Odustani</button>
        <button class="btn-p" onclick="addHolding('${a.id}','${a.type}')">Dodaj i dohvati cijenu</button>
      </div></div>`;
    }
  }
  return html;
}

function editAccMonth(accId, m){
  const a=PORT.accounts.find(x=>x.id===accId);if(!a)return;
  const curr=a.hist[m]||0;
  const v=parseFloat(prompt(`Stanje za ${MS[m]} ${YEAR} (${a.lbl}):`,curr));
  if(!isNaN(v)){a.hist[m]=v;savePort();render();}
}

// ── LIVE PRICES ───────────────────────────────────────────
async function refreshPrices(){
  loadingPrices=true;render();
  try{const r=await fetch('https://api.frankfurter.app/latest?from=USD&to=EUR');const d=await r.json();if(d.rates?.EUR)eurUsd=d.rates.EUR;}catch(e){}
  const allS=PORT.accounts.flatMap(a=>a.type==='stocks'?a.holdings:[]);
  const allC=PORT.accounts.flatMap(a=>a.type==='crypto'?a.holdings:[]);
  const syms=[...new Set(allC.map(h=>h.sym))];
  if(syms.length){
    try{
      const r=await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${syms.join(',')}&vs_currencies=eur&include_24hr_change=true`);
      const d=await r.json();
      allC.forEach(h=>{if(d[h.sym]){h.price=d[h.sym].eur;h.chg=d[h.sym].eur_24h_change;}});
    }catch(e){}
  }
  // EUR suffixes — already in EUR, no conversion needed
  const EUR_SUFFIXES=['.MI','.AS','.PA','.BR','.DE','.F','.MC','.SW','.VI','.CO','.HE','.OL','.ST'];
  function isEurTicker(ticker){ return EUR_SUFFIXES.some(s=>ticker.toUpperCase().endsWith(s)); }
  await Promise.all(allS.map(async h=>{
    try{
      const url=`https://query1.finance.yahoo.com/v8/finance/chart/${h.ticker}?interval=1d&range=2d`;
      const r=await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
      const o=await r.json();const d=JSON.parse(o.contents);
      const m=d.chart.result[0].meta;
      // If ticker is already EUR-denominated, don't convert
      const conv=isEurTicker(h.ticker)?1:eurUsd;
      h.price=m.regularMarketPrice*conv;
      h.chg=m.chartPreviousClose?((m.regularMarketPrice-m.chartPreviousClose)/m.chartPreviousClose*100):null;
    }catch(e){}
  }));
  loadingPrices=false;savePort();render();
}

async function addHolding(accId,type){
  const a=PORT.accounts.find(x=>x.id===accId);if(!a)return;
  const qty=parseFloat(document.getElementById('hq')?.value)||0;
  const id='h'+Date.now();
  if(type==='stocks'){
    const ticker=document.getElementById('ht')?.value.trim().toUpperCase();if(!ticker)return;
    a.holdings.push({id,ticker,isin:document.getElementById('hi')?.value.trim(),name:document.getElementById('hn')?.value.trim()||ticker,qty,price:null,chg:null});
    addingHolding=false;savePort();render();
    try{
      const url=`https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?interval=1d&range=2d`;
      const r=await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
      const o=await r.json();const d=JSON.parse(o.contents);const m=d.chart.result[0].meta;
      const h=a.holdings.find(h=>h.id===id);
      if(h){const conv=isEurTicker(ticker)?1:eurUsd;h.price=m.regularMarketPrice*conv;h.chg=m.chartPreviousClose?((m.regularMarketPrice-m.chartPreviousClose)/m.chartPreviousClose*100):null;}
    }catch(e){}
  } else {
    const sym=document.getElementById('hs')?.value.trim().toLowerCase();
    const lbl=document.getElementById('hl')?.value.trim().toUpperCase()||sym?.toUpperCase();
    if(!sym)return;
    a.holdings.push({id,sym,lbl,name:lbl,qty,price:null,chg:null});
    addingHolding=false;savePort();render();
    try{
      const r=await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${sym}&vs_currencies=eur&include_24hr_change=true`);
      const d=await r.json();const h=a.holdings.find(h=>h.id===id);
      if(h&&d[sym]){h.price=d[sym].eur;h.chg=d[sym].eur_24h_change;}
    }catch(e){}
  }
  savePort();render();
}
function delHolding(accId,hId){
  const a=PORT.accounts.find(x=>x.id===accId);
  if(a)a.holdings=a.holdings.filter(h=>h.id!==hId);
  savePort();render();
}

// ── PIN / BIOMETRIC ───────────────────────────────────────
const NUMKEYS=[
  {n:'1',s:''},{n:'2',s:'ABC'},{n:'3',s:'DEF'},
  {n:'4',s:'GHI'},{n:'5',s:'JKL'},{n:'6',s:'MNO'},
  {n:'7',s:'PQRS'},{n:'8',s:'TUV'},{n:'9',s:'WXYZ'},
  {n:'fp',s:''},{n:'0',s:''},{n:'del',s:''},
];
function buildNumpad(){
  const np=document.getElementById('numpad');np.innerHTML='';
  NUMKEYS.forEach(k=>{
    const b=document.createElement('button');b.className='nk';
    if(k.n==='fp'){b.innerHTML='<i class="ti ti-fingerprint" style="font-size:24px"></i>';b.onclick=tryBio;}
    else if(k.n==='del'){b.innerHTML='⌫';b.onclick=()=>{pinEntry=pinEntry.slice(0,-1);updateDots();};}
    else{b.innerHTML=k.n+(k.s?`<span class="sub">${k.s}</span>`:'');b.onclick=()=>enterDigit(k.n);}
    np.appendChild(b);
  });
}
function updateDots(){for(let i=0;i<4;i++)document.getElementById('d'+i).classList.toggle('on',i<pinEntry.length);}
function enterDigit(d){
  if(pinSetup){enterSetup(d);return;}
  if(pinEntry.length>=4)return;
  pinEntry+=d;updateDots();
  if(pinEntry.length===4)setTimeout(checkPin,100);
}
function checkPin(){
  const stored=localStorage.getItem('fin_pin');
  if(!stored||pinEntry===stored){unlock();}
  else{
    document.getElementById('lerr').textContent='Pogrešan PIN.';
    pinEntry='';updateDots();
    setTimeout(()=>document.getElementById('lerr').textContent='',2000);
  }
}
function setupPin(){
  pinSetup=true;pinSetupStep=0;pinEntry='';pinSetupFirst='';updateDots();
  document.getElementById('lerr').textContent='Unesi novi PIN';
}
function enterSetup(d){
  if(pinEntry.length>=4)return;
  pinEntry+=d;updateDots();
  if(pinEntry.length===4){
    setTimeout(()=>{
      if(pinSetupStep===0){pinSetupFirst=pinEntry;pinEntry='';pinSetupStep=1;updateDots();document.getElementById('lerr').textContent='Ponovi PIN';}
      else if(pinEntry===pinSetupFirst){
        localStorage.setItem('fin_pin',pinEntry);
        document.getElementById('lerr').textContent='✓ PIN postavljen!';
        setTimeout(()=>{pinSetup=false;pinEntry='';updateDots();document.getElementById('lerr').textContent='';},1000);
      } else {
        document.getElementById('lerr').textContent='Ne podudaraju se. Pokušaj opet.';
        pinEntry='';pinSetupFirst='';pinSetupStep=0;updateDots();
        setTimeout(()=>document.getElementById('lerr').textContent='Unesi novi PIN',1500);
      }
    },100);
  }
}
async function tryBio(){
  if(!window.PublicKeyCredential)return;
  try{
    const stored=localStorage.getItem('fin_cred');
    if(!stored){
      const c=await navigator.credentials.create({publicKey:{
        challenge:crypto.getRandomValues(new Uint8Array(32)),
        rp:{name:'Financije'},
        user:{id:new Uint8Array(16),name:'user',displayName:'Korisnik'},
        pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
        authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},
        timeout:30000,
      }});
      localStorage.setItem('fin_cred',btoa(String.fromCharCode(...new Uint8Array(c.rawId))));
      unlock();
    } else {
      const cid=Uint8Array.from(atob(stored),c=>c.charCodeAt(0));
      await navigator.credentials.get({publicKey:{
        challenge:crypto.getRandomValues(new Uint8Array(32)),
        allowCredentials:[{id:cid,type:'public-key'}],
        userVerification:'required',timeout:30000,
      }});
      unlock();
    }
  }catch(e){if(e.name!=='NotAllowedError')document.getElementById('lerr').textContent='Biometrija nije uspjela.';}
}
function unlock(){
  document.getElementById('lock').style.display='none';
  document.getElementById('app').style.display='flex';
  pinEntry='';render();
}
function lockApp(){
  document.getElementById('lock').style.display='flex';
  document.getElementById('app').style.display='none';
  pinEntry='';updateDots();
}
let lockTimer;
function resetLock(){clearTimeout(lockTimer);lockTimer=setTimeout(lockApp,5*60*1000);}
document.addEventListener('touchstart',resetLock);document.addEventListener('click',resetLock);

// ── HEADER & NAV ──────────────────────────────────────────
function renderHdr(){
  const isDetail=false;
  const a=isDetail?PORT.accounts.find(x=>x.id===detailAcc):null;
  document.getElementById('hdr').innerHTML=`
    ${isDetail?`<button class="back-btn" onclick="detailAcc=null;addingHolding=false;render()"><i class="ti ti-arrow-left"></i> Natrag</button><span style="font-size:15px;font-weight:500;flex:1;text-align:center">${a?.lbl||''}</span>`:
    `<div class="hdr-mid">
      <button class="mnav-btn" onclick="prevMon()" ${mon<=START_MONTH?'disabled':''}><i class="ti ti-chevron-left"></i></button>
      <span class="month-lbl">${MNAMES[mon]} ${YEAR}</span>
      <button class="mnav-btn" onclick="nextMon()" ${mon>=11?'disabled':''}><i class="ti ti-chevron-right"></i></button>
    </div>`}
    <div class="hdr-act">
      <button class="ico-btn ${hidden?'on':''}" onclick="toggleHide()" title="Sakrij iznose"><i class="ti ${hidden?'ti-eye-off':'ti-eye'}"></i></button>
      <button class="ico-btn" onclick="lockApp()" title="Zaključaj"><i class="ti ti-lock"></i></button>
    </div>`;
}

function prevMon(){if(mon>START_MONTH){mon--;editKey=null;openSubKey=null;render();}}
function nextMon(){if(mon<11){mon++;editKey=null;openSubKey=null;render();}}
function toggleHide(){hidden=!hidden;document.body.classList.toggle('blur',hidden);renderHdr();}

function go(s){
  scr=s;detailAcc=null;editKey=null;editEntryId=null;
  addingIncome=addingMain=addingSub=addingRezija=addingHolding=false;
  ostaloOpen=false;openSubKey=null;bdOpen=false;
  document.querySelectorAll('.ni').forEach(el=>el.classList.remove('on'));
  document.getElementById('ni-'+s)?.classList.add('on');
  render();
}

function render(){
  renderHdr();
  const c=document.getElementById('scr');
  if(scr==='pregled') c.innerHTML=renderPregled();
  else if(scr==='prihodi') c.innerHTML=renderPrihodi();
  else if(scr==='rashodi') c.innerHTML=renderRashodi();
  else if(scr==='rezije') c.innerHTML=renderRezije();
  else if(scr==='stednja') c.innerHTML=renderStednja();
}

// ── INIT ──────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded',()=>{
  loadData();loadPort();buildNumpad();
  mon=START_MONTH;
  setTimeout(tryBio,500);
  resetLock();
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
});
</script>
